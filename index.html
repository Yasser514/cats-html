

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Explore a beautiful, responsive photo gallery built with HTML and CSS Flexbox."
  >

  <title>Photo Gallery | Flexbox Design</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="header">
    <h1>CSS Flexbox Photo Gallery</h1>
    <p>Discover beautiful moments, one photo at a time.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Photo gallery">
      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/1.jpg"
        alt="Gallery photograph 1"
        loading="eager"
        fetchpriority="high"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/2.jpg"
        alt="Gallery photograph 2"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/3.jpg"
        alt="Gallery photograph 3"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/4.jpg"
        alt="Gallery photograph 4"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/5.jpg"
        alt="Gallery photograph 5"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/6.jpg"
        alt="Gallery photograph 6"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/7.jpg"
        alt="Gallery photograph 7"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/8.jpg"
        alt="Gallery photograph 8"
        loading="lazy"
      >

      <img
        src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/9.jpg"
        alt="Gallery photograph 9"
        loading="lazy"
      >
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 CSS Flexbox Photo Gallery</p>
  </footer>
</body>
</html>
